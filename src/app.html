<title>Purdue Classic Heat Sheet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-column phone app — sticky status bar, scrolling view, fixed bottom tabs. Style lanes color-code every heat. */
:root{
  --bg:#F3F3F8; --surface:#FFFFFF; --sunk:#E9E9F1; --ink:#191A2C; --muted:#62647A; --line:#DCDCE7;
  --accent:#5E2A9C; --accent-soft:#EFE6FA; --accent-ink:#FFFFFF;
  --smooth:#0B8582; --standard:#3A4CC0; --rhythm:#C96A10; --latin:#BE2C66; --other:#6B6E85;
  --good:#1E7A45; --warn:#B4500C; --warn-soft:#FDEBDC; --live:#E0B000;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12121C; --surface:#1C1C2A; --sunk:#252536; --ink:#ECEBF5; --muted:#A0A1B8; --line:#2F2F44;
  --accent:#B98AF0; --accent-soft:#2D2245; --accent-ink:#14101E;
  --smooth:#3CC2BD; --standard:#8695FF; --rhythm:#F2A04E; --latin:#F2709F; --other:#9C9EB5;
  --good:#5BD08C; --warn:#F5A35C; --warn-soft:#3A2617; --live:#F2CB3A; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#12121C; --surface:#1C1C2A; --sunk:#252536; --ink:#ECEBF5; --muted:#A0A1B8; --line:#2F2F44;
  --accent:#B98AF0; --accent-soft:#2D2245; --accent-ink:#14101E;
  --smooth:#3CC2BD; --standard:#8695FF; --rhythm:#F2A04E; --latin:#F2709F; --other:#9C9EB5;
  --good:#5BD08C; --warn:#F5A35C; --warn-soft:#3A2617; --live:#F2CB3A; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.top .spacer{flex:1}
.pace{font-size:12px;font-weight:600;padding:5px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pace.late{background:var(--warn-soft);color:var(--warn)}
.sync{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok{background:var(--good)} .sync.local{background:var(--warn)}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(84px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="true"]{color:var(--accent)}

h2{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:6px 0 -4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--latin)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
textarea{font-family:var(--f-mono);font-size:12px;min-height:150px;resize:vertical}
label.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}

/* style lanes */
.lane-smooth{--lane:var(--smooth)} .lane-standard{--lane:var(--standard)} .lane-rhythm{--lane:var(--rhythm)} .lane-latin{--lane:var(--latin)} .lane-other{--lane:var(--other)}
.evno{font-family:var(--f-mono);font-weight:600;font-size:12px;color:var(--lane);border:1.5px solid var(--lane);border-radius:6px;padding:1px 5px;line-height:1.3;white-space:nowrap}
.round{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.dances{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* on the floor */
.floor{border-radius:16px;padding:16px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.floor::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--lane)}
.floor .label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 var(--live);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.floor .name{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.12;letter-spacing:-.015em;margin:8px 0 6px;text-wrap:balance}
.floor .controls{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:14px}
.floor .controls .primary{font-size:16px;padding:13px}

/* alert card */
.me{border-radius:16px;padding:16px;background:var(--accent-soft);border:1.5px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.me.hot{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.me.hot .muted{color:inherit;opacity:.85}
.me .big{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.05;letter-spacing:-.02em}
.me .what{font-weight:600;margin-top:6px}

/* heat list */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.heat{display:grid;grid-template-columns:76px 1fr;gap:8px;padding:11px 12px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;position:relative}
.heat:first-child{border-top:0}
.heat::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--lane)}
.heat .when{display:flex;flex-direction:column;gap:1px}
.heat .when .t{font-family:var(--f-mono);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.heat .when .est{font-family:var(--f-mono);font-size:11.5px;color:var(--warn);font-variant-numeric:tabular-nums}
.heat .body{min-width:0;display:flex;flex-direction:column;gap:5px}
.heat .title{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap;font-weight:600}
.heat.done{opacity:.45}
.heat.now{background:color-mix(in srgb,var(--live) 16%,var(--surface))}
.heat.now .when .t::after{content:" ●";color:var(--live)}
.heat.mine .title{color:var(--accent)}
/* Tentative: only happens with a callback. Hatched, dashed lane, quieter type. */
.heat.tentative{background:repeating-linear-gradient(135deg,transparent 0 7px,color-mix(in srgb,var(--line) 55%,transparent) 7px 8px)}
.heat.tentative::before{background:none;border-left:3px dashed var(--lane);width:0}
.heat.tentative .title{font-weight:500;color:var(--muted)}
.heat.tentative .when .t{color:var(--muted);font-weight:500}
.heat.tentative .evno{border-style:dashed}
.ifcb{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1.5px dashed var(--muted);border-radius:999px;padding:1px 7px;white-space:nowrap}
.sure{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--good);border:1.5px solid var(--good);border-radius:999px;padding:1px 7px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px}
.toggle{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:4px 0;font-weight:600;font-size:12.5px;color:var(--ink)}
.toggle .knob{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.toggle .knob::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0 / .2);transition:transform .15s}
.toggle[aria-checked="true"] .knob{background:var(--accent)}
.toggle[aria-checked="true"] .knob::after{transform:translateX(14px)}
@media (prefers-reduced-motion:reduce){.toggle .knob,.toggle .knob::after{transition:none}}
.legend .l-sure{background:var(--surface);border:1.5px solid var(--ink)}
.legend .l-maybe{border:1.5px dashed var(--muted);background:repeating-linear-gradient(135deg,transparent 0 3px,var(--line) 3px 4px)}
.break{padding:8px 12px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk);border-top:1px solid var(--line);display:flex;gap:10px;width:100%;border-left:0;border-right:0;border-bottom:0;text-align:left}
.break:first-child{border-top:0}
.break.now{background:color-mix(in srgb,var(--live) 22%,var(--sunk));color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--sunk);white-space:nowrap}
.chip.me{background:var(--accent);color:var(--accent-ink);padding:3px 8px;border:0;border-radius:999px}
.chip.out{text-decoration:line-through;opacity:.6}
.chip.maybe{background:transparent;border:1.5px dashed color-mix(in srgb,var(--muted) 70%,transparent);color:var(--muted);padding:2px 7px}
.chip.me.maybe{background:transparent;border-color:var(--accent);color:var(--accent)}
.cb{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.cb:first-child{border-top:0;padding-top:0}.cb:last-child{padding-bottom:0}
.cb .q{font-size:14px}.cb .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn.yes{border-color:var(--good);color:var(--good)} .btn.no{border-color:var(--line);color:var(--muted)}
.tag{font-size:12px;font-weight:700}
.away{font-size:12px;color:var(--muted);font-weight:600}

.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;min-width:0;border:0;background:none;border-radius:8px;padding:7px 4px;font-weight:600;font-size:12.5px;line-height:1.2;color:var(--muted);text-wrap:balance}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}

.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.person{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.person[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.person b{font-weight:700}
.person span{font-size:12px;color:var(--muted)}

.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:18px;margin-bottom:6px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(10 10 20 / .45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;
  padding-block:16px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sheet h3{font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.15;margin:0;text-wrap:balance}
.sheet .stack{display:flex;flex-direction:column;gap:8px}
.couple-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.couple-row:first-child{border-top:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}

.entry{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:8px}
.entry:first-child{border-top:0;padding-top:0}
.entry summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px}
.entry summary::-webkit-details-marker{display:none}
.ev-line{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:13.5px}
.ok{color:var(--good);font-weight:700}
.bad{color:var(--warn);font-weight:700}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.banner{border-radius:12px;padding:10px 12px;background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:13.5px}
</style>

<header class="top">
  <div class="brand">Heat Sheet<small id="compName">Purdue Ballroom Classic</small></div>
  <div class="spacer"></div>
  <span class="pace" id="pace">As scheduled</span>
  <span class="sync" id="sync" title="Connecting"></span>
</header>

<main id="view"></main>

<nav class="tabs" aria-label="Sections">
  <button data-tab="now"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>Now</button>
  <button data-tab="schedule"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>Schedule</button>
  <button data-tab="people"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.8-3.2 3-5 5.5-5s4.7 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.2c2.4-.4 4.3 1.2 5 4.3"/></svg>People</button>
  <button data-tab="setup"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Setup</button>
</nav>

<div id="layer"></div>

<script>
/*PARSER*/

// ---------- state ----------
const LS = { get(k,d){ try{ const v = localStorage.getItem('hs:'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
             set(k,v){ try{ localStorage.setItem('hs:'+k, JSON.stringify(v)); }catch(e){} } };
let S = { heats:[], couples:[], live:{ currentId:null, setAt:null, calls:{} } };
let loaded = { schedule:false, entries:false, live:false };
let mode = 'connecting'; // shared | local
let db = null;
let ui = { tab: LS.get('tab','now'), filter: LS.get('filter','team'), viewing: null, sheet:null, confirm:null };
let prefs = Object.assign({ me:'', threshold:3, sound:true, vibrate:true, awake:false, showMaybe:true }, LS.get('prefs',{}));
const savePrefs = () => LS.set('prefs', prefs);

// ---------- derived ----------
let D = null;
function derive(){
  const events = eventsFromSchedule(S.heats);
  const coupleEvs = new Map();   // coupleId -> [{entry, ev}]
  const unmatched = [];
  for(const c of S.couples){
    const list = [];
    for(const e of c.events){
      const man = (Array.isArray(c.manual)?c.manual:[]).find(m => m.entry === e);
      const ev = man ? man.ev : matchEntry(e, events);
      list.push({ entry:e, ev: (ev!=null && events.has(ev)) ? ev : null, manual: !!man });
      if(ev==null || !events.has(ev)) unmatched.push({ couple:c, entry:e });
    }
    coupleEvs.set(c.id, list);
  }
  const info = new Map(), team = new Map(), ranks = new Map();
  S.heats.forEach(h => { if(h.ev==null) return; const r = parseHeatName(h.name).rank; const a = ranks.get(h.ev) || []; if(!a.includes(r)) a.push(r); ranks.set(h.ev, a); });
  for(const a of ranks.values()) a.sort((x,y)=>x-y);
  S.heats.forEach((h,i) => {
    const p = h.ev!=null ? parseHeatName(h.name) : { style: 'other', rank: 0 };
    info.set(h.id, Object.assign({ i, sched: parseClock(h.t) }, p));
    if(h.ev==null) return;
    const on = [], maybe = [], outList = [], first = ranks.get(h.ev)[0];
    for(const c of S.couples){
      if(!(coupleEvs.get(c.id)||[]).some(x => x.ev === h.ev)) continue;
      const st = callState(c.id, h.ev, p.rank, first);
      (st==='in' ? on : st==='maybe' ? maybe : outList).push(c);
    }
    team.set(h.id, { on, maybe, out: outList, first });
  });
  const curIdx = S.live.currentId ? S.heats.findIndex(h => h.id === S.live.currentId) : -1;
  let delay = 0;
  if(curIdx >= 0 && S.live.setAt){
    const d = new Date(S.live.setAt);
    delay = d.getHours()*60 + d.getMinutes() + d.getSeconds()/60 - info.get(S.heats[curIdx].id).sched;
    if(Math.abs(delay) > 600) delay = 0; // set on another day: ignore
  }
  const people = new Map();
  for(const c of S.couples) for(const n of [c.lead, c.follow]){ const k = cleanName(n); if(k && k !== 'TBA') people.set(k, people.get(k) || { sure:0, maybe:0 }); }
  for(const [id,t] of team) for(const [list,kind] of [[t.on,'sure'],[t.maybe,'maybe']]) for(const c of list) for(const n of [c.lead,c.follow]){ const k = cleanName(n); if(people.has(k)) people.get(k)[kind]++; }
  D = { events, coupleEvs, unmatched, info, team, curIdx, delay, people, ranks };
}
// Everyone dances the first round. Later rounds count only once a callback is recorded.
function callState(cid, ev, rank, first){
  const r = S.live.calls?.[cid+'_'+ev] || {};
  const reach = r.reach ?? first;
  if(rank <= reach) return 'in';
  if(r.cut != null) return 'out';
  return 'maybe';
}
const prevRank = (ev, rank) => { const a = D.ranks.get(ev)||[]; const i = a.indexOf(rank); return i > 0 ? a[i-1] : rank; };
const nextRank = (ev, rank) => { const a = D.ranks.get(ev)||[]; const i = a.indexOf(rank); return i >= 0 && i < a.length-1 ? a[i+1] : null; };
const heatOf = (ev, rank) => S.heats.find(h => h.ev === ev && parseHeatName(h.name).rank === rank);
function pendingCallbacks(){
  const out = [];
  if(D.curIdx < 0) return out;
  for(const c of S.couples) for(const x of (D.coupleEvs.get(c.id)||[])){
    if(x.ev == null) continue;
    const r = S.live.calls?.[c.id+'_'+x.ev] || {}; if(r.cut != null) continue;
    const reach = r.reach ?? (D.ranks.get(x.ev)||[])[0], nx = nextRank(x.ev, reach);
    if(nx == null) continue;
    const done = heatOf(x.ev, reach), upcoming = heatOf(x.ev, nx);
    if(!done || !upcoming || D.info.get(done.id).i >= D.curIdx) continue;
    if(out.some(o => o.c.id === c.id && o.ev === x.ev)) continue;
    out.push({ c, ev:x.ev, done, upcoming, reach, nx });
  }
  return out.sort((a,b) => D.info.get(a.upcoming.id).i - D.info.get(b.upcoming.id).i);
}
const cleanName = n => (n||'').replace(/\s*\(.*?\)\s*/g,'').trim();
function est(h){ const f = D.info.get(h.id); if(!f) return null; return f.sched + (D.curIdx >= 0 && f.i > D.curIdx ? D.delay : 0); }
function nowMin(){ const d = new Date(); return d.getHours()*60 + d.getMinutes() + d.getSeconds()/60; }
function heatsAway(h){ const i = D.info.get(h.id).i; return D.curIdx < 0 ? null : i - D.curIdx; }
function involves(c, name){ return cleanName(c.lead) === name || cleanName(c.follow) === name; }
function partnerOf(c, name){ const o = cleanName(c.lead) === name ? c.follow : c.lead; return o; }
function upcomingFor(name){
  const out = [];
  S.heats.forEach((h,i) => { if(h.ev==null || i < Math.max(D.curIdx,0)) return; const t = D.team.get(h.id);
    let c = t.on.find(c => involves(c,name)); if(c){ out.push({ h, c, maybe:false }); return; }
    c = t.maybe.find(c => involves(c,name)); if(c) out.push({ h, c, maybe:true }); });
  return out;
}
const inHeat = t => t.on.length + t.maybe.length;
function teamUpcoming(n){
  const out = [];
  for(let i = Math.max(D.curIdx + 1, 0); i < S.heats.length && out.length < n; i++){ const h = S.heats[i]; const t = h.ev!=null && D.team.get(h.id); if(t && (t.on.length || (prefs.showMaybe && t.maybe.length))) out.push(h); }
  return out;
}

// ---------- persistence ----------
const writing = { schedule:Promise.resolve(), entries:Promise.resolve(), live:Promise.resolve() };
function payload(which){ return which==='schedule' ? { heats:S.heats } : which==='entries' ? { couples:S.couples } : { currentId:S.live.currentId, setAt:S.live.setAt, calls:S.live.calls||{} }; }
function persist(which){
  derive(); render(); if(which==='live') checkAlerts();
  if(mode === 'local'){ LS.set('local', { heats:S.heats, couples:S.couples, live:S.live }); return; }
  if(mode !== 'shared') return;
  const body = JSON.parse(JSON.stringify(payload(which)));
  writing[which] = writing[which].then(() => db.doc('comp/'+which).set(body)).catch(e => {
    toast(e && (e.code==='not_granted' || e.code==='revoked') ? 'You have view-only access, so this change was not saved. Ask the owner for edit access.' :
          e && e.code==='quota_exceeded' ? 'Storage is full: ' + e.message : 'Could not save. Check your connection and try again.');
  });
}
async function boot(){
  derive(); render();
  setTimeout(() => { if(mode==='connecting') goLocal(); }, 11000);
  try{ db = await window.claude?.use?.('db'); }catch(e){ db = null; }
  if(!db){ goLocal(); return; }
  mode = 'shared';
  for(const which of ['schedule','entries','live']){
    db.doc('comp/'+which).onSnapshot(snap => {
      const d = snap.exists ? snap.data() : null;
      if(which==='schedule') S.heats = d?.heats || [];
      if(which==='entries') S.couples = d?.couples || [];
      if(which==='live') S.live = { currentId:d?.currentId||null, setAt:d?.setAt||null, calls:d?.calls||{} };
      loaded[which] = true; derive(); softRender(); checkAlerts();
    }, err => { if(err && (err.code==='not_granted' || err.code==='capability_disabled')) goLocal(); });
  }
}
function goLocal(){
  if(mode === 'local') return;
  mode = 'local';
  const l = LS.get('local', null);
  if(l){ S.heats = l.heats||[]; S.couples = l.couples||[]; S.live = Object.assign({ currentId:null,setAt:null,calls:{} }, l.live||{}); }
  loaded = { schedule:true, entries:true, live:true };
  derive(); render();
}

// ---------- alerts ----------
let audio = null; const alerted = new Set();
function chime(times){
  if(!prefs.sound) return;
  try{
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if(audio.state === 'suspended') audio.resume();
    for(let k=0;k<times;k++){ [784, 1047].forEach((f,j) => {
      const o = audio.createOscillator(), g = audio.createGain(), t0 = audio.currentTime + k*0.55 + j*0.16;
      o.frequency.value = f; o.type = 'sine'; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.25,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.4);
      o.connect(g).connect(audio.destination); o.start(t0); o.stop(t0+0.45); }); }
  }catch(e){}
}
function buzz(p){ if(prefs.vibrate) try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }
function checkAlerts(){
  if(!prefs.me || !D || D.curIdx < 0) return;
  const nx = upcomingFor(prefs.me).find(x => !x.maybe && D.info.get(x.h.id).i > D.curIdx);
  if(!nx) return;
  const away = heatsAway(nx.h);
  const key1 = nx.h.id + ':soon', key2 = nx.h.id + ':deck';
  if(away === 1 && !alerted.has(key2)){ alerted.add(key2); alerted.add(key1); chime(2); buzz([300,120,300,120,300]); toast("You're on deck. Next heat is yours."); }
  else if(away <= prefs.threshold && !alerted.has(key1)){ alerted.add(key1); chime(1); buzz([250,100,250]); toast(`Heads up: you dance in ${away} heats.`); }
}
let wake = null;
async function setAwake(on){
  try{ if(on){ wake = await navigator.wakeLock.request('screen'); } else if(wake){ await wake.release(); wake = null; } }
  catch(e){ if(on){ toast('This browser would not keep the screen on.'); prefs.awake = false; savePrefs(); render(); } }
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible' && prefs.awake) setAwake(true); });

// ---------- actions ----------
function setCurrent(id){ S.live.currentId = id; S.live.setAt = Date.now(); alertedPrune(); persist('live'); }
function alertedPrune(){}
function step(dir){
  let i = D.curIdx + dir;
  if(D.curIdx < 0) i = 0;
  if(i < 0 || i >= S.heats.length) return;
  if(dir < 0){ // a correction: keep the current pace instead of restarting the clock
    const m = D.info.get(S.heats[i].id).sched + D.delay, d = new Date(); d.setHours(0,0,0,0);
    S.live.currentId = S.heats[i].id; S.live.setAt = d.getTime() + m*60000; return persist('live');
  }
  setCurrent(S.heats[i].id);
}
function setCall(cid, ev, reach, cut){
  S.live.calls = Object.assign({}, S.live.calls);
  const k = cid+'_'+ev, first = (D.ranks.get(ev)||[])[0];
  if(cut == null && reach <= first) delete S.live.calls[k]; else S.live.calls[k] = cut == null ? { reach } : { reach, cut };
  persist('live');
}

let toastTimer;
function toast(msg){
  let el = document.querySelector('.toast');
  if(!el){ el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role','status'); document.body.appendChild(el); }
  el.textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 3800);
}

// ---------- rendering helpers ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const coupleName = c => `${cleanName(c.lead)} & ${cleanName(c.follow) || 'TBA'}`;
function coupleChip(c, maybe){ const mine = prefs.me && involves(c, prefs.me); return `<span class="chip${mine?' me':''}${maybe?' maybe':''}" ${maybe?'title="Waiting on a callback"':''}>${esc(coupleName(c))}${maybe?' ?':''}</span>`; }
const chipsFor = t => [...t.on.map(c => coupleChip(c,false)), ...(prefs.showMaybe ? t.maybe.map(c => coupleChip(c,true)) : [])].join('');
function roundOf(h){ const f = D.info.get(h.id); return f.single ? 'Single round' : ROUND_LABEL[f.rank]; }
function evTitle(h){ return esc(parseHeatName(h.name).base); }
function etaText(h){
  const e = est(h), f = D.info.get(h.id);
  return fmtClock(e);
}
function paceText(){
  if(D.curIdx < 0) return { t:'Not started', late:false };

}
function heatRow(h, opts={}){
  const f = D.info.get(h.id);
  const cls = ['heat', 'lane-'+f.style];
  if(D.curIdx >= 0 && f.i < D.curIdx) cls.push('done');
  if(f.i === D.curIdx) cls.push('now');
  const t = D.team.get(h.id);
  const who = opts.person;
  const tentative = who ? !t.on.some(c => involves(c, who)) : (t.on.length === 0 && t.maybe.length > 0);
  if(tentative && !prefs.showMaybe && f.i !== D.curIdx) return '';
  if(tentative) cls.push('tentative');
  if(prefs.me && t.on.some(c => involves(c, prefs.me))) cls.push('mine');
  const e = est(h), showEst = D.curIdx >= 0 && f.i > D.curIdx && Math.abs(e - f.sched) >= 2;

    <span class="when"><span class="t">${esc(fmtClock(f.sched))}</span>${showEst?`<span class="est">≈ ${esc(fmtClock(e))}</span>`:''}${opts.away && away>0?`<span class="away">${away} away</span>`:''}</span>

const legend = () => `<div class="legend" style="justify-content:space-between"><span style="gap:12px;flex-wrap:wrap"><span><i class="l-sure"></i>Dancing for sure</span>${prefs.showMaybe?'<span><i class="l-maybe"></i>Only if called back</span>':''}</span>

    return `<details class="entry" data-couple="${c.id}" ${ui.open===c.id?'open':''}><summary><span>${esc(coupleName(c))}</span><span class="${bad?'bad':'muted'}" style="font-size:13px;font-weight:600">${bad?bad+' unmatched':list.length+' events'}</span></summary>
      <div class="row" style="flex-wrap:nowrap"><input type="text" id="lead-${c.id}" value="${esc(c.lead)}" aria-label="Lead"><input type="text" id="follow-${c.id}" value="${esc(c.follow)}" aria-label="Follow"><button class="btn small" data-savenames="${c.id}">Save</button></div>
      ${list.map((x,k) => `<div class="ev-line"><span>${esc(x.entry)}<br>${x.ev!=null?`<span class="ok" style="font-size:12px">Heat ${x.ev}: ${esc(D.events.get(x.ev).base)}</span>`:
        `<select data-fix="${c.id}" data-k="${k}" aria-label="Pick event for ${esc(x.entry)}"><option value="">Pick the event…</option>${evOpts.map(e=>`<option value="${e.num}">${e.num} · ${esc(e.base)}</option>`).join('')}</select>`}</span>
        <button class="btn small ghost danger" data-rmev="${c.id}" data-k="${k}" aria-label="Remove ${esc(x.entry)}">Remove</button></div>`).join('')}
      <div class="row" style="flex-wrap:nowrap"><select id="add-${c.id}" aria-label="Add event"><option value="">Add an event…</option>${evOpts.map(e=>`<option value="${e.num}">${e.num} · ${esc(e.base)}</option>`).join('')}</select><button class="btn small" data-addev="${c.id}">Add</button></div>
      ${ui.confirm==='del-'+c.id ? `<div class="row"><span class="bad">Delete this couple?</span><button class="btn small danger" data-delcouple="${c.id}">Delete</button><button class="btn small" data-cancel>Keep</button></div>`
        : `<div><button class="btn small ghost danger" data-askdel="${c.id}">Delete couple</button></div>`}
    </details>`; }).join('') || '<div class="muted">No couples yet.</div>'}
    <div class="row" style="margin-top:10px;flex-wrap:nowrap"><input type="text" id="newLead" placeholder="Lead"><input type="text" id="newFollow" placeholder="Follow"><button class="btn small primary" id="addCouple">Add couple</button></div>
  </div>`;
  // import
  html += `<h2>Day-of schedule</h2><div class="card" style="display:flex;flex-direction:column;gap:10px">
    <span class="muted" style="font-size:13.5px">When the real schedule is posted, copy the heat list (from the PDF or live.o2cm.com) and paste it here. One heat per line, like <span class="mono">9:39 AM [4] Newcomer Amer. Waltz 1st Round</span>. Couples are re-matched automatically and recall marks are kept.</span>
    <textarea id="schedText" aria-label="Schedule text" placeholder="8:37 AM [1] Bronze Amer. Smooth 1st Round (WT)&#10;8:48 AM [2] Bronze Amer. Smooth 1st Round (FV)"></textarea>
    <div class="row"><button class="btn primary" id="importSched">Replace schedule</button><span class="muted" id="schedPreview" style="font-size:13px"></span></div>
  </div>`;
  html += `<h2>Partnerships</h2><div class="card" style="display:flex;flex-direction:column;gap:10px">
    <span class="muted" style="font-size:13.5px">Paste rows from the partnerships spreadsheet: lead, follow, level, then events separated by commas. This replaces every couple.</span>
    <textarea id="entText" aria-label="Partnerships text" placeholder="Chris&#9;Brooke&#9;Bronze&#9;Bronze I. Standard (WQ), Bronze A. Smooth (WT)"></textarea>
    <div class="row"><button class="btn primary" id="importEnt">Replace couples</button><span class="muted" id="entPreview" style="font-size:13px"></span></div>
  </div>`;
  html += `<h2>Reset</h2><div class="card row">${ui.confirm==='reset' ? `<span class="bad">Clear the floor position and all recall marks?</span><button class="btn small danger" id="doReset">Clear</button><button class="btn small" data-cancel>Cancel</button>`
    : `<button class="btn danger" id="askReset">Clear live tracking</button><span class="muted" style="font-size:13px">Use before the next competition.</span>`}</div>`;
  return html;
}

function sheetFor(id){
  const h = S.heats.find(x => x.id === id); if(!h) return '';
  const f = D.info.get(id), t = D.team.get(id);
  const isNow = f.i === D.curIdx;
  let html = `<div class="grab"></div>
    <div><div class="row" style="gap:8px">${h.ev!=null?`<span class="evno lane-${f.style}">${h.ev}</span><span class="round">${esc(roundOf(h))}</span>`:''}<span class="mono muted">${esc(fmtClock(f.sched))}${D.curIdx>=0 && f.i>D.curIdx?` · est ${esc(fmtClock(est(h)))}`:''}</span></div>
    <h3 style="margin-top:6px">${h.ev!=null?evTitle(h):esc(h.label)}</h3></div>
    <button class="btn primary" data-setnow="${id}" ${isNow?'disabled':''}>${isNow?'On the floor now':'This heat is on the floor now'}</button>`;
  if(h.ev!=null && t){
    const all = [...t.on, ...t.maybe, ...t.out];
    if(all.length){
      const firstRound = f.rank === t.first, pr = prevRank(h.ev, f.rank);
      html += `<div><h2 style="margin:0 0 6px">Team in this event</h2><div>${all.map(c => {
        const st = t.on.includes(c) ? 'in' : t.maybe.includes(c) ? 'maybe' : 'out';
        let right;
        if(st==='in' && firstRound) right = `<span class="muted tag">${f.single?'Single round':'Dances this round'}</span>`;
        else if(st==='in') right = `<span class="row" style="gap:6px"><span class="tag ok">Called back</span><button class="btn small ghost" data-call="${c.id}" data-ev="${h.ev}" data-reach="${pr}">Undo</button></span>`;
        else if(st==='out') right = `<span class="row" style="gap:6px"><span class="tag muted">Not called back</span><button class="btn small ghost" data-call="${c.id}" data-ev="${h.ev}" data-reach="${S.live.calls?.[c.id+'_'+h.ev]?.cut ?? pr}">Undo</button></span>`;
        else right = `<span class="row" style="gap:6px"><button class="btn small yes" data-call="${c.id}" data-ev="${h.ev}" data-reach="${f.rank}">Called back</button><button class="btn small no" data-call="${c.id}" data-ev="${h.ev}" data-reach="${pr}" data-cut="${pr}">Not called</button></span>`;
        return `<div class="couple-row"><span class="chip${st==='out'?' out':st==='maybe'?' maybe':''}">${esc(coupleName(c))}${st==='maybe'?' ?':''}</span>${right}</div>`; }).join('')}</div>
        ${!firstRound ? `<p class="muted" style="font-size:12.5px;margin:6px 0 0">Everyone dances the first round. For this round, mark who got a callback. Dashed names are still waiting.</p>`:''}</div>`;
    }
  }
  html += `<div class="stack"><h2 style="margin:0">Fix this line</h2>
    <div class="row" style="flex-wrap:nowrap"><input type="text" id="editT" value="${esc(h.t)}" aria-label="Time" style="max-width:110px">
    <input type="text" id="editName" value="${esc(h.ev!=null?`[${h.ev}] ${h.name}`:h.label)}" aria-label="Heat"></div>
    <div class="row"><button class="btn" data-saveheat="${id}">Save</button><button class="btn" data-insert="${id}">Add a heat after</button>
    ${ui.confirm==='delheat' ? `<button class="btn danger" data-delheat="${id}">Confirm delete</button>` : `<button class="btn ghost danger" data-askdelheat>Delete</button>`}</div></div>
    <button class="btn ghost" data-close>Close</button>`;
  return html;
}

// ---------- render ----------
function render(){
  if(!D) return;
  const v = document.getElementById('view');
  const keepScroll = window.scrollY;
  v.innerHTML = ui.tab==='now' ? viewNow() : ui.tab==='schedule' ? viewSchedule() : ui.tab==='people' ? viewPeople() : viewSetup();
  if(ui.tab === renderedTab) window.scrollTo(0, keepScroll);
  renderedTab = ui.tab;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-current', String(b.dataset.tab===ui.tab)));
  const p = paceText(), pe = document.getElementById('pace'); pe.textContent = p.t; pe.classList.toggle('late', p.late);
  const s = document.getElementById('sync'); s.className = 'sync ' + (mode==='shared'?'ok':mode==='local'?'local':'');
  s.title = mode==='shared'?'Synced with the team':mode==='local'?'This phone only':'Connecting';
  const layer = document.getElementById('layer');
  layer.innerHTML = ui.sheet ? `<div class="scrim" data-close><div class="sheet" role="dialog" aria-modal="true">${sheetFor(ui.sheet)}</div></div>` : '';
  if(ui.sheet && !S.heats.find(h=>h.id===ui.sheet)){ ui.sheet = null; layer.innerHTML = ''; }
}
let renderedTab = null;
function go(tab){ ui.tab = tab; LS.set('tab', tab); ui.confirm = null; render(); window.scrollTo(0,0); if(tab==='schedule') setTimeout(jumpNow, 30); }
function jumpNow(){ const el = document.querySelector('#schedList .now') || document.querySelector('#schedList .heat:not(.done)'); if(el) el.scrollIntoView({ block:'center' }); }

// ---------- events ----------
document.addEventListener('click', e => {
  const t = e.target.closest('button, .scrim, [data-close]'); if(!t) return;
  if(audio && audio.state==='suspended') audio.resume();
  const d = t.dataset;
  if(t.classList.contains('scrim') && e.target !== t) return;
  if(d.tab) return go(d.tab);
  if(d.goto) return go(d.goto);
  if('close' in d){ ui.sheet = null; ui.confirm = null; return render(); }
  if('cancel' in d){ ui.confirm = null; return render(); }
  if(d.heat){ ui.sheet = d.heat; ui.confirm = null; return render(); }
  if(d.act==='next') return step(1);
  if(d.act==='back') return step(-1);
  if(d.act==='jump') return jumpNow();
  if(d.filter){ ui.filter = d.filter; LS.set('filter', d.filter); render(); return jumpNow(); }
  if(d.view){ ui.viewing = d.view; return render(); }
  if(d.me){ prefs.me = d.me; savePrefs(); alerted.clear(); toast(`Alerts set for ${d.me}.`); return render(); }
  if(d.setnow){ setCurrent(d.setnow); ui.sheet = null; return render(); }
  if(d.call){ setCall(d.call, +d.ev, +d.reach, d.cut!=null ? +d.cut : null); toast(d.cut!=null ? 'Marked not called back.' : 'Callback saved.'); return; }
  if('askdelheat' in d){ ui.confirm = 'delheat'; return render(); }
  if(d.delheat){ S.heats = S.heats.filter(h => h.id !== d.delheat); ui.sheet = null; ui.confirm = null; return persist('schedule'); }
  if(d.saveheat || d.insert){
    const id = d.saveheat || d.insert;
    const tv = document.getElementById('editT').value.trim(), nv = document.getElementById('editName').value.trim();
    if(d.insert){
      const i = S.heats.findIndex(h => h.id === id);
      const nh = { id:'h'+Date.now().toString(36), t:S.heats[i].t, ev:S.heats[i].ev, name:'New heat' };
      if(S.heats[i].ev==null){ nh.ev = (D.events.keys().next().value) ?? 1; }
      S.heats.splice(i+1, 0, nh); ui.sheet = nh.id; ui.confirm = null; toast('Heat added. Edit its time and name.'); return persist('schedule');
    }
    if(parseClock(tv)==null) return toast('Write the time like 9:39 AM.');
    const h = S.heats.find(x => x.id === id); h.t = tv.toUpperCase();
    const m = /^\[(\d+)\]\s*(.+)$/.exec(nv);
    if(m){ h.ev = +m[1]; h.name = m[2]; delete h.label; } else { delete h.ev; delete h.name; h.label = nv; }
    toast('Saved.'); return persist('schedule');
  }
  if(t.id==='tMaybe'){ prefs.showMaybe = !prefs.showMaybe; savePrefs(); return render(); }
  if(t.id==='tSound'){ prefs.sound = !prefs.sound; savePrefs(); return render(); }
  if(t.id==='tVib'){ prefs.vibrate = !prefs.vibrate; savePrefs(); return render(); }
  if(t.id==='tAwake'){ prefs.awake = !prefs.awake; savePrefs(); setAwake(prefs.awake); return render(); }
  if(t.id==='tTest'){ chime(2); buzz([300,120,300]); return toast("This is what you'll hear when you're on deck."); }
  if(d.savenames){
    const c = S.couples.find(x => x.id === d.savenames);
    c.lead = document.getElementById('lead-'+c.id).value.trim() || 'TBA';
    c.follow = document.getElementById('follow-'+c.id).value.trim() || 'TBA';
    ui.open = c.id; toast('Names saved.'); return persist('entries');
  }
  if(d.rmev){ const c = S.couples.find(x => x.id === d.rmev); const entry = c.events[+d.k]; c.events.splice(+d.k,1); c.manual = (c.manual||[]).filter(m => m.entry !== entry); ui.open = c.id; return persist('entries'); }
  if(d.addev){
    const c = S.couples.find(x => x.id === d.addev), v = +document.getElementById('add-'+c.id).value; if(!v) return;
    const label = D.events.get(v).base; if(!c.events.includes(label)){ c.events.push(label); c.manual = (c.manual||[]).concat({ entry:label, ev:v }); }
    ui.open = c.id; return persist('entries');
  }
  if(d.askdel){ ui.confirm = 'del-'+d.askdel; ui.open = d.askdel; return render(); }
  if(d.delcouple){ S.couples = S.couples.filter(c => c.id !== d.delcouple); ui.confirm = null; return persist('entries'); }
  if(t.id==='addCouple'){
    const l = document.getElementById('newLead').value.trim(), f = document.getElementById('newFollow').value.trim();
    if(!l) return toast('Type at least the lead’s name.');
    const c = { id:'c'+Date.now().toString(36), lead:l, follow:f||'TBA', events:[], manual:[] };
    S.couples.push(c); ui.open = c.id; return persist('entries');
  }
  if(t.id==='importSched'){
    const heats = parseSchedule(document.getElementById('schedText').value);
    if(!heats.some(h=>h.ev!=null)) return toast('No heats found. Each line needs a time and an event number in brackets.');
    S.heats = heats; S.live.currentId = null; S.live.setAt = null; persist('live'); persist('schedule');
    document.getElementById('schedText').value = ''; return toast(`Schedule replaced: ${heats.filter(h=>h.ev!=null).length} heats.`);
  }
  if(t.id==='importEnt'){
    const couples = parseEntries(document.getElementById('entText').value);
    if(!couples.length) return toast('No couples found. Each line needs a lead, a follow and at least one event.');
    S.couples = couples; persist('entries'); document.getElementById('entText').value = ''; return toast(`${couples.length} couples loaded.`);
  }
  if(t.id==='askReset'){ ui.confirm = 'reset'; return render(); }
  if(t.id==='doReset'){ S.live = { currentId:null, setAt:null, calls:{} }; ui.confirm = null; alerted.clear(); return persist('live'); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id==='mePick' || t.id==='mePick2'){ prefs.me = t.value; savePrefs(); alerted.clear(); render(); if(prefs.me) toast(`Alerts set for ${prefs.me}.`); return; }
  if(t.id==='thr'){ prefs.threshold = +t.value; savePrefs(); alerted.clear(); return render(); }
  if(t.dataset.fix){
    const c = S.couples.find(x => x.id === t.dataset.fix), entry = c.events[+t.dataset.k], v = +t.value; if(!v) return;
    c.manual = (c.manual||[]).filter(m => m.entry !== entry).concat({ entry, ev:v }); ui.open = c.id; return persist('entries');
  }
});
document.addEventListener('input', e => {
  if(e.target.id==='schedText'){ const n = parseSchedule(e.target.value).filter(h=>h.ev!=null).length; document.getElementById('schedPreview').textContent = n ? `${n} heats found` : ''; }
  if(e.target.id==='entText'){ const n = parseEntries(e.target.value).length; document.getElementById('entPreview').textContent = n ? `${n} couples found` : ''; }
});
document.addEventListener('toggle', e => { if(e.target.matches && e.target.matches('details.entry') && e.target.open) ui.open = e.target.dataset.couple; }, true);
document.addEventListener('keydown', e => { if(e.key==='Escape' && ui.sheet){ ui.sheet = null; render(); } });

let pending = false;
const typing = () => !!document.activeElement?.matches?.('input,textarea,select');
function softRender(){ if(typing()) pending = true; else render(); }
document.addEventListener('focusout', () => setTimeout(() => { if(pending && !typing()){ pending = false; render(); } }, 50));
setInterval(() => { if(!D) return; if(!ui.sheet) softRender(); checkAlerts(); }, 20000);
if(prefs.awake) setAwake(true);
boot();
</script>
